name: Web Automation CI/CD Regression Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    name: Run Pytest Regression Suite
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers & OS dependencies
        run: |
          playwright install --with-deps chromium

      - name: Execute Automated Test Suite (UI, API, DB)
        run: |
          pytest -v --html=reports/report.html --self-contained-html

      - name: Publish Test Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-html-report
          path: reports/report.html
          retention-days: 14

      - name: Publish Failure Screenshots Artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-screenshots
          path: screenshots/
          retention-days: 7
